<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Rule-Based Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2Z" stroke="currentColor" stroke-width="2"/>
                        <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
                        <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
                        <path d="M8 15C9.5 16.5 14.5 16.5 16 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span class="status-indicator"></span>
                </div>
                <div>
                    <h2>Rule-Based Chatbot</h2>
                    <p class="status-text">Online &bull; Python Rule Engine</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="clear-btn" title="Clear Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! I am a basic rule-based chatbot. Try sending me inputs like <strong>"hello"</strong>, <strong>"how are you"</strong>, or <strong>"bye"</strong>!
                </div>
                <span class="timestamp">Just now</span>
            </div>
        </div>

        <!-- Suggestion Chips -->
        <div class="suggestions">
            <span class="suggestion-label">Quick Suggestions:</span>
            <button class="chip" onclick="sendSuggested('hello')">hello</button>
            <button class="chip" onclick="sendSuggested('how are you')">how are you</button>
            <button class="chip" onclick="sendSuggested('bye')">bye</button>
        </div>

        <!-- Input Form -->
        <form class="chat-input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Type 'hello', 'how are you', or 'bye'..." autocomplete="off" required>
            <button type="submit" id="send-btn">
                <span>Send</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
